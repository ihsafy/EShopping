<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EShopping - everything you love, delivered" />
    <meta name="theme-color" content="#f6f6f8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>EShopping</title>
    <script>
      /* Set the theme before first paint so a dark-mode reload never flashes light. */
      (function () {
        try {
          var stored = localStorage.getItem('eshopping:theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0a0b0e' : '#f6f6f8');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
